name: Android Capacitor Build (Debug)

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install NPM dependencies
        run: npm ci

      - name: Generate Capacitor assets
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --assetPath assets/logo.png

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: |
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bashirah-Android-Debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/bashirah.apk
