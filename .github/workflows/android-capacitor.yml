name: Android Capacitor Build (Debug)

on:
  push:
    branches:
      - main

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install NPM dependencies
        run: npm ci

      - name: Generate Capacitor assets
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff'

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: |
          npx cap sync android

      - name: Prepare Stable Debug Keystore (Optional)
        working-directory: android
        env:
          ANDROID_DEBUG_SIGNING_KEY: ${{ secrets.ANDROID_DEBUG_SIGNING_KEY }}
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_DEBUG_SIGNING_KEY}" ]; then
            printf "%s" "${ANDROID_DEBUG_SIGNING_KEY}" > debug_keystore.base64
            base64 -d debug_keystore.base64 > app/debug-ci.keystore

            keystore_password="${ANDROID_DEBUG_KEYSTORE_PASSWORD:-android}"
            key_alias="${ANDROID_DEBUG_KEY_ALIAS:-androiddebugkey}"
            key_password="${ANDROID_DEBUG_KEY_PASSWORD:-android}"

            echo "ANDROID_DEBUG_KEYSTORE_PATH=app/debug-ci.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_DEBUG_KEYSTORE_PASSWORD=${keystore_password}" >> "$GITHUB_ENV"
            echo "ANDROID_DEBUG_KEY_ALIAS=${key_alias}" >> "$GITHUB_ENV"
            echo "ANDROID_DEBUG_KEY_PASSWORD=${key_password}" >> "$GITHUB_ENV"
            echo "Using stable debug keystore from GitHub Secrets."
          else
            echo "No stable debug keystore secret found. Gradle default debug keystore will be used."
          fi

      - name: Build Android Debug APK
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: debug.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bashirah-Android-Debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
