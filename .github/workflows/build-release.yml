name: Build Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  publish-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run electron:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bashirah-Desktop-${{ matrix.platform }}-${{ github.run_number }}
          path: dist-electron_build/*

      - name: Add Desktop to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          files: |
            dist-electron_build/*.exe
            dist-electron_build/*.dmg
            dist-electron_build/*.AppImage
            dist-electron_build/*.deb
            dist-electron_build/*.zip
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Generate Assets
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --assetPath assets/logo.png

      - name: Build Web
        run: npm run build

      - name: Initialize or Sync Capacitor
        run: |
          npx cap sync android

      - name: Build Android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK (Manual)
        run: |
          # Find zipalign and apksigner
          BUILD_TOOLS_VERSION="34.0.0"
          ZIPALIGN=$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign
          APKSIGNER=$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner

          # 1. ZipAlign the APK
          $ZIPALIGN -v 4 android/app/build/outputs/apk/release/app-release-unsigned.apk Bashirah-release-aligned.apk

          # 2. Decode the keystore
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 -d > release.keystore

          # 3. Sign the APK
          $APKSIGNER sign --ks release.keystore \
            --ks-key-alias "${{ secrets.ANDROID_ALIAS }}" \
            --ks-pass pass:"${{ secrets.ANDROID_KEY_STORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out Bashirah-release-signed.apk \
            Bashirah-release-aligned.apk

          # 4. Success check
          $APKSIGNER verify Bashirah-release-signed.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bashirah-APK-${{ github.ref_name }}-${{ github.run_number }}
          path: Bashirah-release-signed.apk

      - name: Add APK to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          files: Bashirah-release-signed.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
