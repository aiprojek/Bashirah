name: Build Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  publish-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run electron:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bashirah-Desktop-${{ matrix.platform }}-${{ github.run_number }}
          path: dist-electron_build/*

      - name: Add Desktop to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          files: |
            dist-electron_build/*.exe
            dist-electron_build/*.dmg
            dist-electron_build/*.AppImage
            dist-electron_build/*.deb
            dist-electron_build/*.zip
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate Assets
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --assetPath assets/logo.png

      - name: Build Web
        run: npm run build

      - name: Initialize or Sync Capacitor
        run: |
          npx cap sync android

      - name: Build and Sign Android APK
        working-directory: android
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 1. Decode the keystore robustly
          if [ -z "$SIGNING_KEY" ]; then
            echo "ERROR: ANDROID_SIGNING_KEY secret is empty!"
            exit 1
          fi
          
          # Use a temporary file to avoid shell expansion issues with large base64 strings
          echo "$SIGNING_KEY" > signing_key.base64
          base64 -d signing_key.base64 > app/release.keystore
          
          # 2. Basic Diagnostics
          echo "Diagnostics for keystore:"
          ls -l app/release.keystore
          if [ ! -s app/release.keystore ]; then
            echo "ERROR: Decoded keystore is empty!"
            exit 1
          fi
          file app/release.keystore
          
          # 3. Verify Keystore readability
          keytool -list -v -keystore app/release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEYSTORE_ALIAS" || echo "Keystore verification: FAILED"
          
          # 4. Build and sign
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_PATH: "release.keystore"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bashirah-APK-${{ github.ref_name }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Add APK to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
