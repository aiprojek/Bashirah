name: Build Release

on:
  push:
    branches:
      - main

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release_meta.outputs.release_tag }}
      release_name: ${{ steps.release_meta.outputs.release_name }}
      prerelease: ${{ steps.release_meta.outputs.prerelease }}
      android_version_code: ${{ steps.release_meta.outputs.android_version_code }}
      android_version_name: ${{ steps.release_meta.outputs.android_version_name }}
      electron_app_version: ${{ steps.release_meta.outputs.electron_app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Version
        id: release_meta
        run: |
          release_date_compact="$(date -u +'%Y%m%d')"
          release_date_display="$(date -u +'%Y.%m.%d')"
          release_tag="v${release_date_compact}.${GITHUB_RUN_NUMBER}"
          release_name="Bashirah ${release_tag}"
          prerelease="true"
          build_seq=$((GITHUB_RUN_NUMBER % 100))
          android_version_code=$((10#${release_date_compact} * 100 + build_seq))
          android_version_name="${release_date_display}.${GITHUB_RUN_NUMBER}"
          electron_app_version="${release_date_compact}.${GITHUB_RUN_NUMBER}.0"

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "android_version_code=${android_version_code}" >> "$GITHUB_OUTPUT"
          echo "android_version_name=${android_version_name}" >> "$GITHUB_OUTPUT"
          echo "electron_app_version=${electron_app_version}" >> "$GITHUB_OUTPUT"

      - name: Create and Push Release Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.release_meta.outputs.release_tag }}" >/dev/null 2>&1; then
            echo "Tag already exists, skip push."
          else
            git tag "${{ steps.release_meta.outputs.release_tag }}" "${GITHUB_SHA}"
            git push origin "${{ steps.release_meta.outputs.release_tag }}"
          fi

  publish-desktop:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install NPM Dependencies
        run: npm ci

      - name: Set Electron App Version
        run: npm version --no-git-tag-version "${{ needs.prepare-release.outputs.electron_app_version }}"

      - name: Build Electron App
        run: npm run electron:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bashirah-Desktop-${{ matrix.platform }}-${{ github.run_number }}
          path: dist-electron_build/*

      - name: Add Desktop to Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare-release.outputs.release_name }}
          files: |
            dist-electron_build/*.exe
            dist-electron_build/*.dmg
            dist-electron_build/*.AppImage
            dist-electron_build/*.deb
            dist-electron_build/*.zip
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          prerelease: ${{ needs.prepare-release.outputs.prerelease == 'true' }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-android:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate Assets
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff'

      - name: Build Web
        run: npm run build

      - name: Initialize or Sync Capacitor
        run: |
          npx cap sync android

      - name: Build and Sign Android APK
        working-directory: android
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: "release.keystore"
          ANDROID_VERSION_CODE: ${{ needs.prepare-release.outputs.android_version_code }}
          ANDROID_VERSION_NAME: ${{ needs.prepare-release.outputs.android_version_name }}
        run: |
          # 1. Check if the secret is available
          echo "Checking secret availability..."
          if [ -z "${SIGNING_KEY}" ]; then
            echo "ERROR: ANDROID_SIGNING_KEY is empty in the environment!"
            exit 1
          fi

          # 2. Decode the keystore robustly
          printf "%s" "${SIGNING_KEY}" > signing_key.base64
          base64 -d signing_key.base64 > app/release.keystore

          # 3. Basic Diagnostics
          echo "Diagnostics for keystore:"
          ls -l app/release.keystore
          if [ ! -s app/release.keystore ]; then
            echo "ERROR: Decoded keystore is STILL empty (0 bytes)!"
            exit 1
          fi
          file app/release.keystore

          # 4. Verify Keystore readability
          keytool -list -v -keystore app/release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEYSTORE_ALIAS" || echo "Keystore verification: FAILED"

          # 5. Build and sign
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bashirah-APK-v${{ needs.prepare-release.outputs.android_version_name }}
          # Keep run-based artifact naming to avoid collisions in artifact storage.
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Add APK to Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare-release.outputs.release_name }}
          files: android/app/build/outputs/apk/release/app-release.apk
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          prerelease: ${{ needs.prepare-release.outputs.prerelease == 'true' }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
